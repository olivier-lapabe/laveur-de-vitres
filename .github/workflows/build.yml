name: Build

# Every push imports and checks the project, exports the Web and Windows builds,
# and publishes the Web build on GitHub Pages:
#   - main     -> https://<owner>.github.io/<repo>/
#   - branches -> https://<owner>.github.io/<repo>/preview/<branch, "/" replaced by "-">/
# A branch deploy keeps the latest main build at the site root, but only its own
# preview: one preview lives on the site at a time.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The one place the Godot version is pinned.
  # Keep config/features in project.godot on the same minor version.
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    name: Check and export
    runs-on: ubuntu-24.04
    env:
      GODOT: /home/runner/godot/godot
      BUILD_DIR: /home/runner/build
    steps:
      - uses: actions/checkout@v7

      - name: Restore Godot from cache
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-v1

      - name: Download Godot and its export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tag="${GODOT_VERSION}-stable"
          base="https://github.com/godotengine/godot/releases/download/${tag}"
          editor="Godot_v${tag}_linux.x86_64"
          templates="Godot_v${tag}_export_templates.tpz"
          work="$(mktemp -d)"
          cd "$work"
          curl -fsSL --retry 3 -O "$base/${editor}.zip" -O "$base/${templates}" -O "$base/SHA512-SUMS.txt"
          # Check both downloads against the checksums published with the release.
          grep -E "  (${editor}\.zip|${templates})\$" SHA512-SUMS.txt > expected.txt
          test "$(wc -l < expected.txt)" -eq 2
          sha512sum --check expected.txt
          mkdir -p ~/godot
          unzip -q "${editor}.zip" -d ~/godot
          mv ~/godot/"${editor}" "$GODOT"
          # Keep only the templates this project exports with.
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j "${templates}" 'templates/version.txt' 'templates/web_nothreads_*' 'templates/windows_*_x86_64*' -d "$dest"
          ls -l "$dest"
          rm -rf "$work"

      - name: Stamp the build with its commit
        run: |
          printf 'extends RefCounted\n## Generated by CI: the commit this build was made from.\n\nconst COMMIT := "%s"\n' "${GITHUB_SHA::7}" > scripts/build_info.gd

      - name: Import the project
        run: |
          set -o pipefail
          mkdir -p "$BUILD_DIR/logs"
          "$GODOT" --headless --path . --import 2>&1 | tee "$BUILD_DIR/logs/import.log"
          .github/scripts/fail-on-godot-errors.sh "$BUILD_DIR/logs/import.log"

      - name: Run the main scene headless
        run: |
          set -o pipefail
          "$GODOT" --headless --path . --quit-after 300 2>&1 | tee "$BUILD_DIR/logs/run.log"
          .github/scripts/fail-on-godot-errors.sh "$BUILD_DIR/logs/run.log"
          grep -q "main scene ready" "$BUILD_DIR/logs/run.log" || { echo "::error::The main scene did not start"; exit 1; }

      - name: Run the gameplay tests
        run: |
          set -o pipefail
          "$GODOT" --headless --path . --script res://tests/run_tests.gd 2>&1 | tee "$BUILD_DIR/logs/tests.log"
          .github/scripts/fail-on-godot-errors.sh "$BUILD_DIR/logs/tests.log"

      - name: Export the Web and Windows builds
        run: |
          set -o pipefail
          mkdir -p "$BUILD_DIR/web" "$BUILD_DIR/windows"
          "$GODOT" --headless --path . --export-release "Web" "$BUILD_DIR/web/index.html" 2>&1 | tee "$BUILD_DIR/logs/export-web.log"
          "$GODOT" --headless --path . --export-release "Windows Desktop" "$BUILD_DIR/windows/laveur-de-vitres.exe" 2>&1 | tee "$BUILD_DIR/logs/export-windows.log"
          .github/scripts/fail-on-godot-errors.sh "$BUILD_DIR/logs/export-web.log"
          .github/scripts/fail-on-godot-errors.sh "$BUILD_DIR/logs/export-windows.log"
          test -s "$BUILD_DIR/web/index.html"
          test -s "$BUILD_DIR/web/index.wasm"
          test -s "$BUILD_DIR/web/index.pck"
          test -s "$BUILD_DIR/windows/laveur-de-vitres.exe"
          ls -l "$BUILD_DIR/web" "$BUILD_DIR/windows"

      - name: Upload the Web build
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: ${{ env.BUILD_DIR }}/web
          if-no-files-found: error

      - name: Upload the Windows build
        uses: actions/upload-artifact@v7
        with:
          name: laveur-de-vitres-windows
          path: ${{ env.BUILD_DIR }}/windows
          if-no-files-found: error

      - name: Upload the Godot logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-logs
          path: ${{ env.BUILD_DIR }}/logs
          if-no-files-found: ignore

  deploy:
    name: Publish the Web build
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ steps.site.outputs.subpath }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Work out where this build goes
        id: site
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "subpath=" >> "$GITHUB_OUTPUT"
          else
            slug="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
            echo "subpath=preview/${slug}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the latest main build at the site root
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name web --dir site; then
            echo "Site root: main build from run $run_id."
          else
            echo "No main build available; the site root gets a placeholder page."
            cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head><meta charset="utf-8"><title>Laveur de vitres</title></head>
          <body><p>Laveur de vitres : la version publiée apparaîtra ici après la première fusion sur main.</p></body>
          </html>
          HTML
          fi

      - name: Add this build
        uses: actions/download-artifact@v8
        with:
          name: web
          path: site/${{ steps.site.outputs.subpath }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Link the build in the run summary
        run: |
          echo "Web build: ${{ steps.deployment.outputs.page_url }}${{ steps.site.outputs.subpath }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Windows build: the **laveur-de-vitres-windows** artifact of this run." >> "$GITHUB_STEP_SUMMARY"
